{% extends 'base.html' %}
{% block title %}Defteri Sil{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-12">
    <div class="card p-8 text-center shadow-xl border-t-4 border-red-500">
        <div class="w-20 h-20 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-6 ring-8 ring-red-50/50">
            <i class="fas fa-trash-alt text-3xl text-red-500"></i>
        </div>
        
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Silmek istiyor musunuz?</h1>
        <p class="text-gray-500 mb-8 leading-relaxed">
            <span class="font-bold text-gray-700">"{{ workbook.title }}"</span> dijital defteri ve içindeki sayfa düzeni kalıcı olarak silinecek. Bu işlem geri alınamaz.
        </p>

        <form method="post" class="space-y-3">
            {% csrf_token %}
            <button type="submit" class="btn-danger w-full py-3">
                <i class="fas fa-trash-alt mr-2"></i>Evet, Defteri Sil
            </button>
            <a href="{% url 'workbook_list' %}" class="btn-secondary w-full py-3">
                İptal
            </a>
        </form>
    </div>
</div>
{% endblock %}

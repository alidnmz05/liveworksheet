{% extends 'base.html' %}
{% block title %}Ödev Oluştur{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-6">
        <a href="{% url 'assignment_list' %}" class="text-sm text-gray-500 hover:text-indigo-600"><i class="fas fa-arrow-left mr-1"></i>Geri</a>
        <h1 class="text-2xl font-bold mt-2">Yeni Ödev Oluştur</h1>
    </div>
    <div class="card p-6">
        <form method="post" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium mb-1">Ödev Başlığı</label>
                <input type="text" name="title" required class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" placeholder="Ödev adı">
            </div>
            <div>
                <label class="block text-sm font-medium mb-2">Çalışma Kağıdı</label>
                <select name="worksheet_id" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400">
                    <option value="">Seçin...</option>
                    {% for ws in my_worksheets %}
                    <option value="{{ ws.pk }}">{{ ws.title }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium mb-2">Sınıflar</label>
                <div class="space-y-2">
                    {% for cls in my_classrooms %}
                    <label class="flex items-center gap-2">
                        <input type="checkbox" name="classroom_ids" value="{{ cls.pk }}" class="w-4 h-4 text-indigo-600 rounded">
                        <span class="text-sm">{{ cls.name }} ({{ cls.students.count }} öğrenci)</span>
                    </label>
                    {% endfor %}
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Son Teslim Tarihi</label>
                <input type="datetime-local" name="due_date" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
            </div>
            <div class="flex gap-6">
                <label class="flex items-center gap-2 text-sm">
                    <input type="checkbox" name="allow_multiple_attempts" class="w-4 h-4 text-indigo-600 rounded">
                    Birden fazla denemeye izin ver
                </label>
                <label class="flex items-center gap-2 text-sm">
                    <input type="checkbox" name="show_answers" checked class="w-4 h-4 text-indigo-600 rounded">
                    Sonuçta cevapları göster
                </label>
            </div>
            <button type="submit" class="btn-primary w-full justify-center py-2.5">
                <i class="fas fa-paper-plane"></i> Ödevi Oluştur
            </button>
        </form>
    </div>
</div>
{% endblock %}

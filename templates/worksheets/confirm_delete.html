{% extends 'base.html' %}
{% block title %}Sil: {{ worksheet.title }}{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto mt-10">
    <div class="card p-6 text-center">
        <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <i class="fas fa-trash text-red-600 text-2xl"></i>
        </div>
        <h2 class="text-xl font-bold mb-2">Silmek istiyor musunuz?</h2>
        <p class="text-gray-500 text-sm mb-6">"{{ worksheet.title }}" çalışma kağıdı kalıcı olarak silinecek.</p>
        <div class="flex gap-3 justify-center">
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn-danger">Evet, Sil</button>
            </form>
            <a href="{% url 'worksheet_list' %}" class="btn-secondary">İptal</a>
        </div>
    </div>
</div>
{% endblock %}

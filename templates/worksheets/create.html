{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% trans "Yeni Çalışma Kağıdı" %}{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-6">
        <a href="{% url 'worksheet_list' %}" class="text-sm text-gray-500 hover:text-indigo-600">
            <i class="fas fa-arrow-left mr-1"></i>Geri
        </a>
        <h1 class="text-2xl font-bold mt-2">{% trans "Yeni Çalışma Kağıdı" %}</h1>
    </div>

    <div class="card p-6">
        <form method="post" enctype="multipart/form-data" id="create-form">
            {% csrf_token %}
            <div class="space-y-5">

                <!-- PDF Upload - en üstte ve öne çıkan alan -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        {% trans "PDF Dosyası" %} <span class="text-xs text-gray-400 font-normal ml-1">{% trans "(opsiyonel — her sayfa otomatik oluşturulur)" %}</span>
                    </label>
                    <label id="pdf-drop-zone"
                           class="flex flex-col items-center justify-center gap-2 w-full h-36 border-2 border-dashed border-indigo-300 rounded-xl bg-indigo-50 hover:bg-indigo-100 cursor-pointer transition-colors">
                        <i class="fas fa-file-pdf text-4xl text-indigo-400" id="pdf-icon"></i>
                        <span class="text-sm text-indigo-600 font-medium" id="pdf-label">{% trans "PDF dosyası seçin veya buraya sürükleyin" %}</span>
                        <span class="text-xs text-gray-400" id="pdf-sub">{% trans "Maks. 50 MB" %}</span>
                        <input type="file" name="pdf_file" id="pdf-file-input" accept=".pdf,application/pdf" class="hidden">
                    </label>
                    <!-- Preview: sayfa sayısı -->
                    <div id="pdf-preview" class="hidden mt-2 flex items-center gap-2 bg-green-50 border border-green-200 rounded-lg px-3 py-2 text-sm text-green-700">
                        <i class="fas fa-check-circle"></i>
                        <span id="pdf-preview-text"></span>
                        <button type="button" onclick="clearPdf()" class="ml-auto text-gray-400 hover:text-red-500 text-xs"><i class="fas fa-times"></i> {% trans "Kaldır" %}</button>
                    </div>
                </div>

                <div class="relative flex items-center gap-3">
                    <div class="flex-1 h-px bg-gray-200"></div>
                    <span class="text-xs text-gray-400 shrink-0">{% trans "veya bilgileri doldurun" %}</span>
                    <div class="flex-1 h-px bg-gray-200"></div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{% trans "Başlık" %} <span class="text-red-500">*</span></label>
                    <input type="text" name="title" id="title-input" required
                           class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                           placeholder="{% trans 'Örn: 2. Sınıf Toplama İşlemi' %}">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{% trans "Açıklama" %}</label>
                    <textarea name="description" rows="2"
                              class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                              placeholder="{% trans 'Kağıt hakkında kısa bir açıklama' %}"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{% trans "Ders" %}</label>
                        <select name="subject" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-white">
                            <option value="">{% trans "Seçin..." %}</option>
                            {% for subj in form.subject.field.queryset %}
                            <option value="{{ subj.pk }}">{% trans subj.name %}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{% trans "Seviye" %}</label>
                        <select name="level" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-white">
                            <option value="">{% trans "Seçin..." %}</option>
                            {% for val, lbl in form.level.field.choices %}
                            {% if val %}<option value="{{ val }}">{{ lbl }}</option>{% endif %}
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{% trans "Dil" %}</label>
                        <select name="language" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-white">
                            {% for val, lbl in form.language.field.choices %}
                            <option value="{{ val }}" {% if val == 'tr' %}selected{% endif %}>{{ lbl }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{% trans "Etiketler" %}</label>
                        <input type="text" name="tags"
                               class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                               placeholder="{% trans 'matematik, toplama' %}">
                    </div>
                </div>
                <!-- Puanlama Sistemi -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-star text-amber-500 mr-1"></i>{% trans "Puanlama Sistemi" %}
                        <span class="text-xs text-gray-400 font-normal ml-1">{% trans "(öğrenciye gösterilecek puan)" %}</span>
                    </label>
                    <input type="hidden" name="grading_system" id="grading_system_input" value="100">
                    <div class="grid grid-cols-2 gap-3" id="grading-cards">
                        <!-- 100'lük -->
                        <button type="button" onclick="selectGrading('100')" id="card-100"
                                class="grading-card grading-selected flex flex-col items-center gap-2 p-4 rounded-xl border-2 border-indigo-500 bg-indigo-50 cursor-pointer transition-all hover:shadow-md">
                            <div class="text-3xl font-extrabold text-indigo-600">100</div>
                            <div class="text-xs font-semibold text-indigo-700">{% trans "100'lük Sistem" %}</div>
                            <div class="text-xs text-gray-500 text-center">{% trans 'Öğrenciye 0–100 arası puan gösterilir' %}</div>
                            <div class="flex items-center gap-1 mt-1">
                                <i class="fas fa-check-circle text-indigo-500 text-sm" id="check-100"></i>
                                <span class="text-xs text-indigo-600 font-medium">{% trans "Seçili" %}</span>
                            </div>
                        </button>
                        <!-- 10'luk -->
                        <button type="button" onclick="selectGrading('10')" id="card-10"
                                class="grading-card flex flex-col items-center gap-2 p-4 rounded-xl border-2 border-gray-200 bg-white cursor-pointer transition-all hover:shadow-md hover:border-purple-300">
                            <div class="text-3xl font-extrabold text-purple-500">10</div>
                            <div class="text-xs font-semibold text-purple-600">{% trans "10'luk Sistem" %}</div>
                            <div class="text-xs text-gray-500 text-center">{% trans 'Öğrenciye 0–10 arası puan gösterilir' %}</div>
                            <div class="flex items-center gap-1 mt-1 invisible" id="check-10">
                                <i class="fas fa-check-circle text-purple-500 text-sm"></i>
                                <span class="text-xs text-purple-600 font-medium">{% trans "Seçili" %}</span>
                            </div>
                        </button>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <input type="checkbox" name="is_public" id="is_public" checked class="w-4 h-4 text-indigo-600 rounded">
                    <label for="is_public" class="text-sm text-gray-700">{% trans 'Herkese açık (kütüphaneye eklenebilir)' %}</label>
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="submit" id="submit-btn" class="btn-primary flex-1 justify-center py-2.5">
                        <i class="fas fa-arrow-right"></i> <span id="submit-label">{% trans "Oluştur ve Düzenle" %}</span>
                    </button>
                    <a href="{% url 'worksheet_list' %}" class="btn-secondary justify-center py-2.5">{% trans "İptal" %}</a>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
const pdfInput = document.getElementById('pdf-file-input');
const pdfPreview = document.getElementById('pdf-preview');
const pdfPreviewText = document.getElementById('pdf-preview-text');
const pdfLabel = document.getElementById('pdf-label');
const pdfSub = document.getElementById('pdf-sub');
const titleInput = document.getElementById('title-input');
const submitLabel = document.getElementById('submit-label');
const submitBtn = document.getElementById('submit-btn');

pdfInput.addEventListener('change', function () {
    const file = this.files[0];
    if (!file) return;
    pdfLabel.textContent = file.name;
    pdfSub.textContent = (file.size / 1024 / 1024).toFixed(1) + ' MB';
    pdfPreviewText.textContent = '{% trans 'PDF yüklendi — sayfa sayısı işlem sırasında belirlenir.' %}';
    pdfPreview.classList.remove('hidden');
    // Başlık boşsa dosya adından doldur
    if (!titleInput.value) {
        titleInput.value = file.name.replace(/\.pdf$/i, '').replace(/[-_]/g, ' ');
    }
    submitLabel.textContent = '{% trans 'PDF İşle ve Oluştur' %}';
});

function clearPdf() {
    pdfInput.value = '';
    pdfPreview.classList.add('hidden');
    pdfLabel.textContent = '{% trans "PDF dosyası seçin veya buraya sürükleyin" %}';
    pdfSub.textContent = '{% trans "Maks. 50 MB" %}';
    submitLabel.textContent = 'Oluştur ve Düzenle';
}

// Drag & Drop
const dropZone = document.getElementById('pdf-drop-zone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('bg-indigo-100'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('bg-indigo-100'));
dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('bg-indigo-100');
    const file = e.dataTransfer.files[0];
    if (file && file.type === 'application/pdf') {
        const dt = new DataTransfer();
        dt.items.add(file);
        pdfInput.files = dt.files;
        pdfInput.dispatchEvent(new Event('change'));
    }
});

// İşleme sırasında butonu pasif yap
document.getElementById('create-form').addEventListener('submit', function () {
    if (pdfInput.files[0]) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>{% trans 'PDF işleniyor, lütfen bekleyin...' %}';
    }
});

// ---- Puanlama Sistemi Seçimi ----
function selectGrading(val) {
    document.getElementById('grading_system_input').value = val;

    const cfg = {
        '100': {
            cardCls: 'border-indigo-500 bg-indigo-50',
            numCls: 'text-indigo-600',
            labelCls: 'text-indigo-700',
            checkId: 'check-100',
        },
        '10': {
            cardCls: 'border-purple-500 bg-purple-50',
            numCls: 'text-purple-600',
            labelCls: 'text-purple-700',
            checkId: 'check-10',
        },
    };

    ['100', '10'].forEach(v => {
        const card = document.getElementById('card-' + v);
        const check = document.getElementById('check-' + v);
        if (v === val) {
            card.className = `grading-card grading-selected flex flex-col items-center gap-2 p-4 rounded-xl border-2 ${cfg[v].cardCls} cursor-pointer transition-all hover:shadow-md`;
            check.classList.remove('invisible');
        } else {
            card.className = 'grading-card flex flex-col items-center gap-2 p-4 rounded-xl border-2 border-gray-200 bg-white cursor-pointer transition-all hover:shadow-md hover:border-gray-300';
            check.classList.add('invisible');
        }
    });
}

</script>
{% endblock %}

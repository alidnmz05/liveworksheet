{% extends 'base.html' %}
{% block title %}Yeni Çalışma Kağıdı{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-6">
        <a href="{% url 'worksheet_list' %}" class="text-sm text-gray-500 hover:text-indigo-600">
            <i class="fas fa-arrow-left mr-1"></i>Geri
        </a>
        <h1 class="text-2xl font-bold mt-2">Yeni Çalışma Kağıdı</h1>
    </div>

    <div class="card p-6">
        <form method="post" enctype="multipart/form-data" id="create-form">
            {% csrf_token %}
            <div class="space-y-5">

                <!-- PDF Upload - en üstte ve öne çıkan alan -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        PDF Dosyası <span class="text-xs text-gray-400 font-normal ml-1">(opsiyonel — her sayfa otomatik oluşturulur)</span>
                    </label>
                    <label id="pdf-drop-zone"
                           class="flex flex-col items-center justify-center gap-2 w-full h-36 border-2 border-dashed border-indigo-300 rounded-xl bg-indigo-50 hover:bg-indigo-100 cursor-pointer transition-colors">
                        <i class="fas fa-file-pdf text-4xl text-indigo-400" id="pdf-icon"></i>
                        <span class="text-sm text-indigo-600 font-medium" id="pdf-label">PDF dosyası seçin veya buraya sürükleyin</span>
                        <span class="text-xs text-gray-400" id="pdf-sub">Maks. 50 MB</span>
                        <input type="file" name="pdf_file" id="pdf-file-input" accept=".pdf,application/pdf" class="hidden">
                    </label>
                    <!-- Preview: sayfa sayısı -->
                    <div id="pdf-preview" class="hidden mt-2 flex items-center gap-2 bg-green-50 border border-green-200 rounded-lg px-3 py-2 text-sm text-green-700">
                        <i class="fas fa-check-circle"></i>
                        <span id="pdf-preview-text"></span>
                        <button type="button" onclick="clearPdf()" class="ml-auto text-gray-400 hover:text-red-500 text-xs"><i class="fas fa-times"></i> Kaldır</button>
                    </div>
                </div>

                <div class="relative flex items-center gap-3">
                    <div class="flex-1 h-px bg-gray-200"></div>
                    <span class="text-xs text-gray-400 shrink-0">veya bilgileri doldurun</span>
                    <div class="flex-1 h-px bg-gray-200"></div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Başlık <span class="text-red-500">*</span></label>
                    <input type="text" name="title" id="title-input" required
                           class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                           placeholder="Örn: 2. Sınıf Toplama İşlemi">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Açıklama</label>
                    <textarea name="description" rows="2"
                              class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                              placeholder="Kağıt hakkında kısa bir açıklama"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Ders</label>
                        <select name="subject" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-white">
                            <option value="">Seçin...</option>
                            {% for subj in form.subject.field.queryset %}
                            <option value="{{ subj.pk }}">{{ subj.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Seviye</label>
                        <select name="level" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-white">
                            <option value="">Seçin...</option>
                            {% for val, lbl in form.level.field.choices %}
                            {% if val %}<option value="{{ val }}">{{ lbl }}</option>{% endif %}
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Dil</label>
                        <select name="language" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-white">
                            {% for val, lbl in form.language.field.choices %}
                            <option value="{{ val }}" {% if val == 'tr' %}selected{% endif %}>{{ lbl }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Etiketler</label>
                        <input type="text" name="tags"
                               class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                               placeholder="matematik, toplama">
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <input type="checkbox" name="is_public" id="is_public" checked class="w-4 h-4 text-indigo-600 rounded">
                    <label for="is_public" class="text-sm text-gray-700">Herkese açık (kütüphaneye eklenebilir)</label>
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="submit" id="submit-btn" class="btn-primary flex-1 justify-center py-2.5">
                        <i class="fas fa-arrow-right"></i> <span id="submit-label">Oluştur ve Düzenle</span>
                    </button>
                    <a href="{% url 'worksheet_list' %}" class="btn-secondary justify-center py-2.5">İptal</a>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
const pdfInput = document.getElementById('pdf-file-input');
const pdfPreview = document.getElementById('pdf-preview');
const pdfPreviewText = document.getElementById('pdf-preview-text');
const pdfLabel = document.getElementById('pdf-label');
const pdfSub = document.getElementById('pdf-sub');
const titleInput = document.getElementById('title-input');
const submitLabel = document.getElementById('submit-label');
const submitBtn = document.getElementById('submit-btn');

pdfInput.addEventListener('change', function () {
    const file = this.files[0];
    if (!file) return;
    pdfLabel.textContent = file.name;
    pdfSub.textContent = (file.size / 1024 / 1024).toFixed(1) + ' MB';
    pdfPreviewText.textContent = 'PDF yüklendi — sayfa sayısı işlem sırasında belirlenir.';
    pdfPreview.classList.remove('hidden');
    // Başlık boşsa dosya adından doldur
    if (!titleInput.value) {
        titleInput.value = file.name.replace(/\.pdf$/i, '').replace(/[-_]/g, ' ');
    }
    submitLabel.textContent = 'PDF İşle ve Oluştur';
});

function clearPdf() {
    pdfInput.value = '';
    pdfPreview.classList.add('hidden');
    pdfLabel.textContent = 'PDF dosyası seçin veya buraya sürükleyin';
    pdfSub.textContent = 'Maks. 50 MB';
    submitLabel.textContent = 'Oluştur ve Düzenle';
}

// Drag & Drop
const dropZone = document.getElementById('pdf-drop-zone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('bg-indigo-100'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('bg-indigo-100'));
dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('bg-indigo-100');
    const file = e.dataTransfer.files[0];
    if (file && file.type === 'application/pdf') {
        const dt = new DataTransfer();
        dt.items.add(file);
        pdfInput.files = dt.files;
        pdfInput.dispatchEvent(new Event('change'));
    }
});

// İşleme sırasında butonu pasif yap
document.getElementById('create-form').addEventListener('submit', function () {
    if (pdfInput.files[0]) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>PDF işleniyor, lütfen bekleyin...';
    }
});
</script>
{% endblock %}

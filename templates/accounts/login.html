{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% trans "Giriş Yap" %}{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-10">
    <div class="card p-8">
        <div class="text-center mb-8">
            <i class="fas fa-book-open text-4xl text-indigo-600 mb-3"></i>
            <h1 class="text-2xl font-bold">{% trans "Tekrar Hoş Geldiniz" %}</h1>
            <p class="text-gray-500 text-sm mt-1">{% trans "Hesabınıza giriş yapın" %}</p>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{% trans "E-posta" %}</label>
                    <input type="email" name="email" required
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                           placeholder="ornek@mail.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{% trans "Şifre" %}</label>
                    <input type="password" name="password" required
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                           placeholder="••••••••">
                </div>
                <button type="submit" class="w-full btn-primary justify-center py-2.5">
                    <i class="fas fa-sign-in-alt"></i> {% trans "Giriş Yap" %}
                </button>
            </div>
        </form>
        <p class="text-center text-sm text-gray-500 mt-6">
            {% trans "Hesabınız yok mu?" %} <a href="{% url 'register' %}" class="text-indigo-600 font-medium hover:underline">{% trans "Kayıt Ol" %}</a>
        </p>
    </div>
</div>
{% endblock %}
